<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Menu vertical</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
  <style>
    body {
      background-color: rgb(142, 135, 235);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 10px;
    }
    nav {
      background: rgb(255, 255, 255);
      border-radius: 8px;
      padding: 15px;
      width: 160px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-size: 14px;
    }
    .menu-title {
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
      text-decoration: underline;
      color: #333333;
      font-size: 30px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      margin-bottom: 12px;
    }
    a {
      text-decoration: none;
      color: #0077cc;
      display: block;
      padding: 6px 8px;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    a:hover {
      background-color: #e0f0ff;
      color: #004a99;
    }
    .quit {
      margin-top: 20px;
      text-align: center;
    }
    .quit a {
      background-color: #cc3300;
      color: white;
      padding: 6px 12px;
      border-radius: 5px;
      text-decoration: none;
      display: inline-block;
    }
    .quit a:hover {
      background-color: #998a00;
    }
  </style>
</head>
<body>
  <nav>
    <div class="menu-title">MENU</div>
    <ul>
      <li><a href="presentation.html" target="fenêtrec">Présentation</a></li>
      <li><a href="page2.html" target="fenêtrec">Etat Civil</a></li>
      <li><a href="tableau.html" target="fenêtrec">Tableau</a></li>
      <li><a href="formulaire1.html" target="fenêtrec">Curriculum Vitae</a></li>
      <li><a href="formulaire2.html" target="fenêtrec">Enregistrement des
Etudiants</a></li>
    </ul>
    <div class="quit">
      <a href="quitter.html" target="_top">Quitter</a>
    </div>
  </nav>
</body>
</html>
