<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Accueil - Mon Site Web</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;   
      background-size: cover;
      backdrop-filter: blur(2px);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .header {
      flex: 0 0 20%;
      background-color: rgba(255, 255, 255, 0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 40px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .header img {
      height: 50px;
    }

    .header iframe {
      flex-grow: 1;
      margin: 0 100px;
      height: 100%;
      border: none;
      border-radius: 10px;
    }

    .main {
      flex: 1;
      display: flex;
      gap: 10px;
      padding: 10px;
    }

    .sidebar {
      width: 15%;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .sidebar iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .content {
      flex: 1;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      padding: 10px;
    }

    .content iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 768px) {
      .main {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: 200px;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="c:\Users\Utilisateur\OneDrive\Documents\index\eneam logo.jpeg" alt="Logo ENEAM">
    <iframe src="a.html"></iframe>
    <img src="c:\Users\Utilisateur\OneDrive\Documents\index\logo uac.jpeg" alt="Logo UAC">
  </div>

  <div class="main">
    <div class="sidebar">
      <iframe src="b.html"></iframe>
    </div>
    <div class="content">
      <iframe src="c.html" name="fenêtrec"></iframe>
    </div>
  </div>

</body>
</html>
